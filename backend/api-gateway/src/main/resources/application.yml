server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    # Yerel geliştirmede repo kökündeki .env okunur (JWT_SECRET vb.); Docker'da env değişkenleri kullanılır
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  cloud:
    gateway:
      # Route'lar elle tanımlı. discovery.locator kapalı kalır: açılırsa Eureka'daki her servis
      # (ve /internal/** uçları) /<servis-adı>/** altında otomatik dışarı açılırdı.
      routes:
        # StripPrefix=1: /api/auth/login → auth-service'e /auth/login olarak gider.
        # Servis controller'ları /api öneki olmadan yazılır; Feign çağrılarıyla aynı yollar.
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - StripPrefix=1
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/projects/**,/api/invitations/**
          filters:
            - StripPrefix=1
        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/api/tasks/**
          filters:
            - StripPrefix=1
        - id: dashboard-service
          uri: lb://dashboard-service
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1
        # OpenAPI belgeleri: /api/docs/{servis} → servisin /v3/api-docs'u (Swagger UI bunları okur, yalnızca GET).
        # Servis API_DOCS_ENABLED=false ile kapatılmışsa 404 döner.
        - id: auth-service-api-docs
          uri: lb://auth-service
          predicates:
            - Path=/api/docs/auth
            - Method=GET
          filters:
            - SetPath=/v3/api-docs
        - id: project-service-api-docs
          uri: lb://project-service
          predicates:
            - Path=/api/docs/project
            - Method=GET
          filters:
            - SetPath=/v3/api-docs
        - id: task-service-api-docs
          uri: lb://task-service
          predicates:
            - Path=/api/docs/task
            - Method=GET
          filters:
            - SetPath=/v3/api-docs
        - id: dashboard-service-api-docs
          uri: lb://dashboard-service
          predicates:
            - Path=/api/docs/dashboard
            - Method=GET
          filters:
            - SetPath=/v3/api-docs
      # /internal/** için route yok → gateway 404 döner.

      # CORS yalnızca yedek: frontend normalde aynı origin'den (/api, proxy/nginx) gelir.
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: Authorization,Content-Type
            allow-credentials: true
            max-age: 3600
      default-filters:
        # Servis de CORS header'ı eklerse tarayıcı çift header'ı reddeder; tekini bırak
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Kayıt listesini sık çek: yeni açılan servis gateway'e çabuk yansısın
    registry-fetch-interval-seconds: 10
  instance:
    # Yerelde localhost; Docker'da compose servis adı (EUREKA_INSTANCE_HOSTNAME=api-gateway).
    # prefer-ip-address kullanılmıyor: Windows'ta Docker/WSL sanal ağ kartlarının IP'si seçilebiliyor.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

gateway:
  security:
    # JWT gerektirmeyen yollar (gateway'e gelen hâliyle, /api önekiyle).
    # logout access token değil refresh cookie'si ile doğrulanır; access token süresi
    # dolmuş olsa da çıkış yapılabilmeli (bkz. docs/06, docs/07).
    open-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/logout
      # OpenAPI belgeleri (uçların listesi; veri içermez)
      - /api/docs/**
    # auth-service ile aynı anahtar; boş/kısaysa gateway açılmaz
    jwt-secret: ${JWT_SECRET:}
    # CORS ile aynı kaynak (virgülle birden fazla verilebilir)
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}
    # Kimliği cookie ile doğrulanan yollar: Origin kontrolü (CSRF savunması, docs/07)
    cookie-auth-paths:
      - /api/auth/refresh
      - /api/auth/logout

# Tek Swagger UI: http://localhost:8080/swagger-ui.html (servis üstteki listeden seçilir).
# "Try it out" istekleri belgedeki sunucu adresiyle (/api) yine bu gateway'den geçer.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /api/docs/auth
      - name: project-service
        url: /api/docs/project
      - name: task-service
        url: /api/docs/task
      - name: dashboard-service
        url: /api/docs/dashboard
    urls-primary-name: auth-service
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
