server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  config:
    # Yerel geliştirmede repo kökündeki .env okunur (servis repo kökünden, backend/'den veya
    # modül dizininden çalıştırılabilir). Docker imajında .env yoktur; değerler ortam değişkeninden gelir.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    # Docker'da SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD ortam değişkenleri bunları ezer
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/auth_db
    username: auth_user
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Şemayı Flyway yönetir; Hibernate entity ↔ tablo uyumsuzluğunda açılışta hata verir
      ddl-auto: validate
    properties:
      hibernate:
        # Instant alanları DATETIME(6) kolonlarına UTC olarak yazılır/okunur
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  autoconfigure:
    # Kullanıcılar DB'den doğrulanıyor; Boot'un "generated security password" ile kurduğu
    # bellek içi kullanıcı deposuna gerek yok
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

auth:
  jwt:
    # En az 32 bayt; boşsa servis açılışta hata verir
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
  refresh-token:
    ttl: 7d
    # Yerel http geliştirmede .env'de COOKIE_SECURE=false; varsayılan güvenli taraf
    cookie-secure: ${COOKIE_SECURE:true}
    # Aynı anda iki yenileme (iki sekme) için tolerans; bkz. RefreshTokenService#rotate
    reuse-grace: 10s
  password:
    # docs/07: 10–12. Her +1 hash süresini ~2 katına çıkarır (12 ≈ 200–300 ms)
    bcrypt-strength: 12
  admin:
    # İlk açılışta bu e-postada kullanıcı yoksa ADMIN olarak oluşturulur (varsa dokunulmaz)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
