<ng-container *ngIf="user$ | async as user">
  <h1 class="h3 mb-1">Hoş geldin, {{ user.fullName }}</h1>
  <p class="text-muted mb-4">Projelerin ve görevlerinin özeti burada görünecek.</p>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <p class="mb-3">Proje ve görev ekranları bir sonraki aşamada eklenecek. Bu arada profilini güncelleyebilirsin.</p>
      <a routerLink="/profile" class="btn btn-outline-primary">Profilime git</a>
    </div>
  </div>
</ng-container>
