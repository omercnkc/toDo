<app-auth-shell heading="Giriş yap" subheading="Projelerine ve görevlerine kaldığın yerden devam et.">
  <ng-container *ngIf="!formError" [ngSwitch]="notice">
    <div *ngSwitchCase="'registered'" class="alert alert-success" role="status">
      Kaydın oluşturuldu. Şimdi giriş yapabilirsin.
    </div>
    <div *ngSwitchCase="'passwordChanged'" class="alert alert-success" role="status">
      Şifren değişti ve tüm oturumların kapatıldı. Yeni şifrenle giriş yap.
    </div>
  </ng-container>
  <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="login-email" class="form-label">E-posta</label>
      <input
        id="login-email"
        type="email"
        class="form-control"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
        [class.is-invalid]="isInvalid('email')"
        [attr.aria-invalid]="isInvalid('email')"
        aria-describedby="login-email-error"
      />
      <app-field-error [control]="control('email')" errorId="login-email-error"></app-field-error>
    </div>

    <div class="mb-4">
      <label for="login-password" class="form-label">Şifre</label>
      <div class="input-group has-validation">
        <input
          id="login-password"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="isInvalid('password')"
          [attr.aria-invalid]="isInvalid('password')"
          aria-describedby="login-password-error"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="showPassword = !showPassword"
          [attr.aria-pressed]="showPassword"
          [attr.aria-label]="showPassword ? 'Şifreyi gizle' : 'Şifreyi göster'"
        >
          {{ showPassword ? 'Gizle' : 'Göster' }}
        </button>
        <app-field-error [control]="control('password')" errorId="login-password-error"></app-field-error>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
      <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      {{ submitting ? 'Giriş yapılıyor…' : 'Giriş yap' }}
    </button>
  </form>

  <p authFooter class="text-center text-muted mt-4 mb-0">
    Hesabın yok mu? <a routerLink="/register">Kayıt ol</a>
  </p>
</app-auth-shell>
