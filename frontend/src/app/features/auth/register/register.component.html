<app-auth-shell heading="Kayıt ol" subheading="Ekibinle projelerini ve görevlerini tek yerden yönet.">
  <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="register-full-name" class="form-label">Ad soyad</label>
      <input
        id="register-full-name"
        type="text"
        class="form-control"
        formControlName="fullName"
        autocomplete="name"
        [class.is-invalid]="isInvalid('fullName')"
        [attr.aria-invalid]="isInvalid('fullName')"
        aria-describedby="register-full-name-error"
      />
      <app-field-error [control]="control('fullName')" errorId="register-full-name-error"></app-field-error>
    </div>

    <div class="mb-3">
      <label for="register-email" class="form-label">E-posta</label>
      <input
        id="register-email"
        type="email"
        class="form-control"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        [class.is-invalid]="isInvalid('email')"
        [attr.aria-invalid]="isInvalid('email')"
        aria-describedby="register-email-error"
      />
      <app-field-error [control]="control('email')" errorId="register-email-error"></app-field-error>
    </div>

    <div class="mb-3">
      <label for="register-password" class="form-label">Şifre</label>
      <div class="input-group has-validation">
        <input
          id="register-password"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [class.is-invalid]="isInvalid('password')"
          [attr.aria-invalid]="isInvalid('password')"
          aria-describedby="register-password-hint register-password-error"
        />
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="showPassword = !showPassword"
          [attr.aria-pressed]="showPassword"
          [attr.aria-label]="showPassword ? 'Şifreyi gizle' : 'Şifreyi göster'"
        >
          {{ showPassword ? 'Gizle' : 'Göster' }}
        </button>
        <app-field-error [control]="control('password')" errorId="register-password-error"></app-field-error>
      </div>
      <div id="register-password-hint" class="form-text">En az {{ passwordMinLength }} karakter.</div>
    </div>

    <div class="mb-4">
      <label for="register-confirm-password" class="form-label">Şifre (tekrar)</label>
      <input
        id="register-confirm-password"
        [type]="showPassword ? 'text' : 'password'"
        class="form-control"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [class.is-invalid]="isInvalid('confirmPassword')"
        [attr.aria-invalid]="isInvalid('confirmPassword')"
        aria-describedby="register-confirm-password-error"
      />
      <app-field-error
        [control]="control('confirmPassword')"
        errorId="register-confirm-password-error"
      ></app-field-error>
      <div
        *ngIf="passwordsMismatch && !control('confirmPassword').errors"
        id="register-confirm-password-error"
        class="invalid-feedback d-block"
      >
        Şifreler eşleşmiyor
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
      <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      {{ submitting ? 'Kaydediliyor…' : 'Kayıt ol' }}
    </button>
  </form>

  <p authFooter class="text-center text-muted mt-4 mb-0">
    Zaten hesabın var mı? <a routerLink="/login">Giriş yap</a>
  </p>
</app-auth-shell>
