<div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let toast of toasts$ | async; trackBy: trackById"
    class="toast show align-items-center border-0"
    [ngClass]="'text-bg-' + toast.type"
    role="alert"
  >
    <div class="d-flex">
      <div class="toast-body">{{ toast.message }}</div>
      <button
        type="button"
        class="btn-close me-2 m-auto"
        [class.btn-close-white]="toast.type !== 'warning'"
        aria-label="Kapat"
        (click)="dismiss(toast.id)"
      ></button>
    </div>
  </div>
</div>
