# Frontend konteyneri: Angular SPA + /api → api-gateway (aynı origin; httpOnly refresh çerezi sorunsuz).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker'ın iç DNS'i. proxy_pass değişkenle verildiği için gateway adı her istekte çözülür:
    # nginx gateway'den önce açılabilir, gateway yeniden başlayıp IP değiştirse de çalışır.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    location /api/ {
        # URI kısmı yok → istek yolu olduğu gibi (/api/... önekiyle) gateway'e gider
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Hash'li derleme çıktıları (main.<hash>.js, styles.<hash>.css, font/görsel): içerik değişirse
    # adı da değişir → uzun süreli önbellek. Bulunamazsa 404 (index.html JS diye dönmesin).
    location ~* "\.[0-9a-f]{16,}\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html her açılışta sunucuya sorulur (no-cache = kullanmadan önce doğrula):
    # yeni sürüm yayınlanınca tarayıcı eski hash'li dosyalara bağlı kalmaz.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA yönlendirmesi: /projects/12/board gibi yollar index.html'e düşer, Angular router karşılar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
