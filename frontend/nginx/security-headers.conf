# Güvenlik başlıkları (7-C, docs/07). nginx'te bir location kendi add_header'ını tanımlarsa server
# düzeyindekileri devralmaz; bu yüzden bu dosya her statik location'a include edilir.
# /api yanıtlarına eklenmez: servisler (Spring Security) ve gateway kendi başlıklarını yazar.
#
# CSP: yalnızca kendi kaynağımız. style-src 'unsafe-inline' Angular'ın bileşen stillerini <style> olarak
# eklemesi için gerekli; script-src'de satır içi kod yok (angular.json inlineCritical=false: kritik CSS'in
# onload="this.media='all'" yükleyicisi kapalı). img-src data: Bootstrap'ın SVG ikonları (CSS içinde).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS yalnızca HTTPS arkasında anlamlı (TLS sonlandıran proxy ekler); yerel http kurulumda gönderilmez.
