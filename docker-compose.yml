name: todo

# Servisler ilgili fazlarda eklenir (bkz. docs/09-devops-docker.md).
# Faz 0: MySQL. Faz 1: discovery-server + api-gateway. Faz 2: auth-service.

# Backend servislerinin ortak build ayarı (SERVICE argümanı servis başına verilir)
x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env içinde MYSQL_ROOT_PASSWORD gerekli}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?.env içinde AUTH_DB_PASSWORD gerekli}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?.env içinde PROJECT_DB_PASSWORD gerekli}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?.env içinde TASK_DB_PASSWORD gerekli}
      TZ: Europe/Istanbul
    ports:
      - "${MYSQL_PORT:-3306}:3306"   # yerel geliştirmede servisler IDE'den bağlanır
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build:
      <<: *backend-build
      args:
        SERVICE: discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:8761:8761"   # Eureka paneli; yalnızca bu makineden erişilir (geliştirme)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      <<: *backend-build
      args:
        SERVICE: api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      # Tarayıcının gördüğü frontend adresi; CORS + refresh/logout Origin kontrolü buna göre yapılır
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # auth-service ile aynı anahtar (gateway token'ları doğrular)
      JWT_SECRET: ${JWT_SECRET:?.env içinde JWT_SECRET gerekli}
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"   # dış dünyaya açılan tek backend portu
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      <<: *backend-build
      args:
        SERVICE: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?.env içinde AUTH_DB_PASSWORD gerekli}
      JWT_SECRET: ${JWT_SECRET:?.env içinde JWT_SECRET gerekli}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # İlk açılışta bu e-postada kullanıcı yoksa ADMIN oluşturulur (boşsa atlanır)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: auth-service
      TZ: Europe/Istanbul
    # Port yayınlanmaz: yalnızca gateway üzerinden erişilir (docs/03)
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  project-service:
    build:
      <<: *backend-build
      args:
        SERVICE: project-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/project_db
      SPRING_DATASOURCE_USERNAME: project_user
      SPRING_DATASOURCE_PASSWORD: ${PROJECT_DB_PASSWORD:?.env içinde PROJECT_DB_PASSWORD gerekli}
      # auth-service ile aynı anahtar (token'ları yalnızca doğrular)
      JWT_SECRET: ${JWT_SECRET:?.env içinde JWT_SECRET gerekli}
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: project-service
      TZ: Europe/Istanbul
    # Port yayınlanmaz: yalnızca gateway üzerinden erişilir (docs/03)
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql_data:
